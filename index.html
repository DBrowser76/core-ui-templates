<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Core Layout - Dashboard</title>
    <style>
        :root {
            --sidebar-width: 260px;
            --navbar-height: 60px;
            --bg-primary: #0f172a;
            --bg-surface: #1e293b;
            --text-main: #f8fafc;
            --accent: #38bdf8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-main);
            overflow: hidden; /* Prevents double scrollbars on the window */
            height: 100vh;
            display: flex;
        }

        /* Sidebar Navigation */
        .app-sidebar {
            width: var(--sidebar-width);
            height: 100%;
            background-color: var(--bg-surface);
            display: flex;
            flex-direction: column;
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            flex-shrink: 0;
        }

        /* Viewport Container (Top Bar + Dynamic Stage) */
        .app-viewport {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            height: 100%;
            overflow: hidden;
        }

        /* Top Action/Status Bar */
        .app-navbar {
            height: var(--navbar-height);
            background-color: var(--bg-surface);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            flex-shrink: 0;
        }

        /* Isolated, Scrollable Work Area */
        .app-stage {
            flex-grow: 1;
            padding: 1.5rem;
            overflow-y: auto;
            position: relative;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .card {
            background-color: var(--bg-surface);
            border-radius: 8px;
            padding: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }
    </style>
</head>
<body>

    <!-- Navigation Authority -->
    <aside class="app-sidebar">
        <!-- Sidebar Header / Branding -->
        <div style="padding: 1.5rem; font-weight: 700; border-bottom: 1px solid rgba(255,255,255,0.05);">
            SYSTEM CORE
        </div>
        <!-- Menu Context links go here -->
    </aside>

    <!-- Operational Viewport -->
    <div class="app-viewport">
        
        <!-- Top Control Bar -->
        <header class="app-navbar">
            <div class="nav-left"><span style="color: var(--accent);">//</span> Status: Nominal</div>
            <div class="nav-right">User Session</div>
        </header>

        <!-- Main Execution Stage -->
        <main class="app-stage">
            <div class="grid-container">
                <div class="card">
                    <h3>System Component Alpha</h3>
                    <p style="margin-top: 0.5rem; color: #94a3b8;">Placeholder text for operational metrics, integration statuses, or control blocks.</p>
                </div>
                <div class="card">
                    <h3>System Component Beta</h3>
                    <p style="margin-top: 0.5rem; color: #94a3b8;">Placeholder text for secondary subroutines, logs, or real-time data feeds.</p>
                </div>
            </div>
        </main>
        
    </div>

</body>
</html>
